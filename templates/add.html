<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Квитанция по квартплате — Добавление</title>
    <link rel="stylesheet" href="/static/styles/app.css">
</head>
<body>
<div class="app-frame">
    <main class="add-page">
        <div class="upload-row">
            <div class="upload-box" title="Видео (не сохраняется в лабораторной 2)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="14" height="12" rx="2"/>
                    <path d="M16 10l6-3v10l-6-3"/>
                </svg>
            </div>
            <div class="upload-box" title="Изображение (не сохраняется в лабораторной 2)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                    <circle cx="9" cy="9" r="1.5"/>
                    <path d="M21 15l-5-5-11 11"/>
                </svg>
            </div>
        </div>

        {{ if .Draft }}
        <form action="/publish" method="post">
            <input type="hidden" name="id" value="{{ .Draft.ID }}">

            <div class="field">
                <span>Заголовок:</span>
                <input type="text" value="{{ .Draft.Name }}" disabled>
            </div>

            <div class="field description">
                <span>Описание:</span>
                <textarea name="description" rows="2">{{ .Draft.Description }}</textarea>
            </div>

            <div class="field">
                <span>Тариф:</span>
                <input type="number" step="0.01" name="tariffRate" value="{{ .Draft.TariffRate }}">
            </div>

            <div class="field">
                <span>Норматив:</span>
                <input type="number" step="0.001" name="consumptionNorm" value="{{ .Draft.ConsumptionNorm }}">
            </div>

            <div class="field">
                <span>Ед. изм.:</span>
                <input type="text" name="measurementUnit" value="{{ .Draft.MeasurementUnit }}">
            </div>

            <button type="submit" class="primary-btn">Опубликовать</button>
        </form>
        {{ else }}
        <form action="/add" method="post">
            <div class="field">
                <span>Заголовок:</span>
                <input type="text" name="name" placeholder="Название услуги" required>
            </div>

            <button type="submit" class="primary-btn">Далее</button>
        </form>
        {{ end }}
    </main>

    {{ template "tabbar" }}
</div>
</body>
</html>
